syntax = "proto3";

package meshspan.private.v1;

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message RequestHeader {
  ProtocolVersion version = 1;
  bytes mesh_id = 2;
  bytes partition_id = 3;
  uint64 routing_epoch = 4;
  bytes sender_node_id = 5;
  uint64 sender_incarnation = 6;
  bytes request_id = 7;
  bytes operation_id = 8;
  sint64 deadline_unix_micros = 9;
  bytes trace_id = 10;
}

message VersionedPayload {
  uint32 format_version = 1;
  bytes canonical_bytes = 2;
}

message LogPosition {
  uint64 term = 1;
  uint64 index = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID = 1;
  ERROR_CODE_UNAUTHORISED = 2;
  ERROR_CODE_STALE = 3;
  ERROR_CODE_CONFLICT = 4;
  ERROR_CODE_UNSUPPORTED = 5;
  ERROR_CODE_EXHAUSTED = 6;
  ERROR_CODE_CORRUPT = 7;
  ERROR_CODE_DEADLINE = 8;
  ERROR_CODE_UNAVAILABLE = 9;
  ERROR_CODE_INTERNAL_CONTRACT = 10;
}

message WireError {
  ErrorCode code = 1;
  uint32 diagnostic_code = 2;
  optional uint64 retry_after_micros = 3;
}

enum OperationOutcome {
  OPERATION_OUTCOME_UNSPECIFIED = 0;
  OPERATION_OUTCOME_BRANCH_COMMITTED = 1;
  OPERATION_OUTCOME_POLICY_COMMITTED = 2;
  OPERATION_OUTCOME_GLOBALLY_CONVERGED = 3;
  OPERATION_OUTCOME_REJECTED = 4;
  OPERATION_OUTCOME_IN_PROGRESS = 5;
  OPERATION_OUTCOME_REDIRECT = 6;
  OPERATION_OUTCOME_STALE = 7;
  OPERATION_OUTCOME_FAILED = 8;
}

message OperationResult {
  OperationOutcome outcome = 1;
  optional uint64 committed_revision = 2;
  optional WireError error = 3;
  optional VersionedPayload result = 4;
  bytes result_digest = 5;
}

message ShardIdentity {
  bytes manifest_digest = 1;
  uint64 stripe_index = 2;
  uint32 shard_index = 3;
  uint32 generation = 4;
}
