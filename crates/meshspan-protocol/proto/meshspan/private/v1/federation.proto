syntax = "proto3";

package meshspan.private.v1;

import "meshspan/private/v1/common.proto";
import "meshspan/private/v1/data.proto";

message FederationHeader {
  ProtocolVersion version = 1;
  bytes relationship_id = 2;
  bytes sender_mesh_id = 3;
  bytes recipient_mesh_id = 4;
  bytes request_id = 5;
  bytes operation_id = 6;
  uint64 authority_epoch = 7;
  sint64 deadline_unix_micros = 8;
  bytes trace_id = 9;
  bytes replay_nonce = 10;
}

message FederationHello {
  repeated ProtocolVersion versions = 1;
  uint64 identity_generation = 2;
  bytes public_identity_chain = 3;
  bytes challenge_nonce = 4;
  repeated uint32 feature_bits = 5;
  uint64 maximum_control_bytes = 6;
  uint64 maximum_data_frame_bytes = 7;
  uint32 maximum_streams = 8;
  bytes signature = 9;
}

message FederationWelcome {
  ProtocolVersion selected_version = 1;
  uint64 identity_generation = 2;
  bytes request_challenge_nonce = 3;
  bytes responder_challenge_nonce = 4;
  uint64 authority_revision = 5;
  uint64 maximum_control_bytes = 6;
  uint64 maximum_data_frame_bytes = 7;
  uint32 maximum_streams = 8;
  bytes signature = 9;
}

message FetchFederationAuthority {
  uint64 after_revision = 1;
  bytes cursor = 2;
  uint32 limit = 3;
  bytes signature = 4;
}

message FederationAuthorityPage {
  uint64 authority_revision = 1;
  repeated VersionedPayload records = 2;
  bytes next_cursor = 3;
  bytes page_digest = 4;
  bytes signature = 5;
}

message FetchFederatedBranchPage {
  bytes grant_id = 1;
  VersionedPayload resource_scope = 2;
  repeated bytes requested_head_ids = 3;
  repeated bytes known_commit_ids = 4;
  bytes cursor = 5;
  uint32 limit = 6;
  bytes signature = 7;
}

message FederatedBranchPage {
  bytes grant_id = 1;
  VersionedPayload resource_scope = 2;
  repeated VersionedPayload branch_commits = 3;
  repeated bytes immutable_object_digests = 4;
  bytes next_cursor = 5;
  bytes page_digest = 6;
  bytes signature = 7;
  bytes export_token = 8;
}

message FetchFederatedHistoryObject {
  bytes grant_id = 1;
  VersionedPayload resource_scope = 2;
  bytes export_token = 3;
  bytes object_digest = 4;
  bytes signature = 5;
}

message FederatedHistoryObjectHeader {
  bytes grant_id = 1;
  VersionedPayload resource_scope = 2;
  bytes export_token = 3;
  bytes object_digest = 4;
  uint64 declared_length = 5;
  uint64 maximum_frame_bytes = 6;
  bytes signature = 7;
}

message FetchFederatedContentLayout {
  bytes grant_id = 1;
  VersionedPayload resource_scope = 2;
  bytes manifest_id = 3;
  bytes export_token = 4;
  bytes manifest_object_digest = 5;
  bytes cursor = 6;
  uint32 limit = 7;
  bytes signature = 8;
}

message FederatedContentLayoutPage {
  bytes grant_id = 1;
  VersionedPayload resource_scope = 2;
  bytes manifest_id = 3;
  bytes export_token = 4;
  bytes manifest_object_digest = 5;
  VersionedPayload layout_header = 6;
  repeated VersionedPayload chunks = 7;
  bytes next_cursor = 8;
  bytes page_digest = 9;
  bytes signature = 10;
  repeated FederatedContentShardRoute shard_routes = 11;
}

message FederatedContentShardRoute {
  bytes provider_node_id = 1;
  bytes target_id = 2;
  uint64 target_generation = 3;
  ShardIdentity shard = 4;
  uint64 expected_length = 5;
  bytes expected_digest = 6;
}

message FetchFederatedContentShard {
  bytes grant_id = 1;
  VersionedPayload resource_scope = 2;
  bytes manifest_id = 3;
  bytes export_token = 4;
  bytes manifest_object_digest = 5;
  bytes target_id = 6;
  uint64 target_generation = 7;
  ShardIdentity shard = 8;
  uint64 expected_length = 9;
  bytes expected_digest = 10;
  bytes signature = 11;
  bytes provider_node_id = 12;
}

message FederatedContentShardHeader {
  bytes grant_id = 1;
  VersionedPayload resource_scope = 2;
  bytes manifest_id = 3;
  bytes export_token = 4;
  bytes manifest_object_digest = 5;
  bytes target_id = 6;
  uint64 target_generation = 7;
  ShardIdentity shard = 8;
  uint64 declared_length = 9;
  bytes content_digest = 10;
  uint64 maximum_frame_bytes = 11;
  sint64 served_at_unix_micros = 12;
  bytes signature = 13;
  bytes provider_node_id = 14;
}

message ProposeFederatedBranch {
  bytes grant_id = 1;
  VersionedPayload resource_scope = 2;
  VersionedPayload grant_use_evidence = 3;
  repeated bytes branch_head_digests = 4;
  bytes expected_owner_head_digest = 5;
  bytes signature = 6;
}

message FederatedBranchResult {
  OperationResult result = 1;
  VersionedPayload accepting_swarm_receipt = 2;
  optional uint64 owner_history_revision = 3;
  optional VersionedPayload protection_receipt = 4;
  optional bytes quarantine_id = 5;
  repeated bytes alternative_head_digests = 6;
  bytes signature = 7;
}

enum RemoteShardAction {
  REMOTE_SHARD_ACTION_UNSPECIFIED = 0;
  REMOTE_SHARD_ACTION_PUT = 1;
  REMOTE_SHARD_ACTION_GET = 2;
  REMOTE_SHARD_ACTION_SCRUB = 3;
  REMOTE_SHARD_ACTION_REPAIR = 4;
  REMOTE_SHARD_ACTION_RETIRE = 5;
  REMOTE_SHARD_ACTION_RECLAIM = 6;
}

message RequestFederatedStorageCapability {
  bytes grant_id = 1;
  bytes target_id = 2;
  uint64 target_generation = 3;
  ShardIdentity shard = 4;
  RemoteShardAction action = 5;
  uint64 maximum_bytes = 6;
  bytes scope_digest = 7;
  bytes signature = 8;
  bytes allocation_id = 9;
}

message FederatedStorageCapability {
  bytes grant_id = 1;
  bytes target_id = 2;
  uint64 target_generation = 3;
  ShardIdentity shard = 4;
  RemoteShardAction action = 5;
  uint64 maximum_bytes = 6;
  sint64 valid_until_unix_micros = 7;
  bytes capability_nonce = 8;
  bytes canonical_capability = 9;
  bytes signature = 10;
  bytes allocation_id = 11;
  sint64 issued_at_unix_micros = 12;
}

message FederatedStorageReceipt {
  bytes grant_id = 1;
  bytes target_id = 2;
  uint64 target_generation = 3;
  ShardIdentity shard = 4;
  RemoteShardAction action = 5;
  uint64 affected_bytes = 6;
  sint64 completed_at_unix_micros = 7;
  bytes capability_digest = 8;
  bytes result_digest = 9;
  bytes signature = 10;
  bytes allocation_id = 11;
}

message FetchFederatedStorageInventory {
  bytes grant_id = 1;
  bytes target_id = 2;
  uint64 target_generation = 3;
  bytes cursor = 4;
  uint32 limit = 5;
  bytes signature = 6;
}

message FederatedStorageInventoryPage {
  bytes grant_id = 1;
  bytes target_id = 2;
  uint64 target_generation = 3;
  repeated VersionedPayload records = 4;
  bytes next_cursor = 5;
  bytes page_digest = 6;
  bytes signature = 7;
}

// Backups retain their own exact object identity; they are never fabricated shards.
message FederatedBackupScope {
  bytes relationship_id = 1;
  bytes remote_mesh_id = 2;
  bytes provider_mesh_id = 3;
  bytes allocation_id = 4;
  bytes grant_id = 5;
  bytes provider_node_id = 6;
  bytes target_id = 7;
  uint64 target_generation = 8;
  uint64 relationship_authority_epoch = 9;
  uint64 grant_revision = 10;
  uint64 allocation_revision = 11;
  // Immutable allocation origin, distinct from current permission in grant_id.
  bytes namespace_grant_id = 12;
}

enum RemoteBackupAction {
  REMOTE_BACKUP_ACTION_UNSPECIFIED = 0;
  REMOTE_BACKUP_ACTION_STORE = 1;
  REMOTE_BACKUP_ACTION_READ = 2;
  REMOTE_BACKUP_ACTION_VERIFY = 3;
  REMOTE_BACKUP_ACTION_DELETE = 4;
  REMOTE_BACKUP_ACTION_LOOKUP = 5;
}

message FederatedBackupOperation {
  ProtocolVersion contract_version = 1;
  bytes operation_id = 2;
  sint64 deadline_unix_micros = 3;
  optional uint64 authority_revision = 4;
  BackupObjectIdentity object = 5;
  RemoteBackupAction action = 6;
  string object_reference = 7;
  optional uint64 retirement_revision = 8;
}

message FederatedBackupPermit {
  FederatedBackupScope scope = 1;
  FederatedBackupOperation operation = 2;
  sint64 issued_at_unix_micros = 3;
  sint64 expires_at_unix_micros = 4;
  bytes capability_nonce = 5;
  bytes permit_digest = 6;
}

message RequestFederatedBackupCapability {
  FederatedBackupScope scope = 1;
  FederatedBackupOperation operation = 2;
  bytes signature = 3;
}

message FederatedBackupCapability {
  bytes request_digest = 1;
  optional FederatedBackupPermit permit = 2;
  optional WireError rejection = 3;
  bytes signature = 4;
}

message ExecuteFederatedBackup {
  FederatedBackupPermit permit = 1;
  bytes signature = 2;
}

message FederatedBackupReady {
  bytes permit_digest = 1;
  uint64 maximum_frame_bytes = 2;
  optional WireError rejection = 3;
  bytes signature = 4;
}

message FederatedBackupResult {
  bytes permit_digest = 1;
  sint64 completed_at_unix_micros = 2;
  oneof outcome {
    BackupObjectReceipt stored = 10;
    BackupReadReceipt read = 11;
    BackupObjectReceipt verified = 12;
    BackupDeleteReceipt deleted = 13;
    BackupObjectReceipt looked_up = 15;
    WireError rejection = 14;
  }
  bytes signature = 3;
}

// Allocation observations confer no capability and reserve no capacity.
message FetchFederatedBackupAllocations {
  bytes grant_id = 1;
  uint64 required_bytes = 2;
  bytes cursor = 3;
  uint32 limit = 4;
  bytes signature = 5;
}

message FederatedBackupAllocation {
  FederatedBackupScope scope = 1;
  uint64 maximum_bytes = 2;
  sint64 valid_from_unix_micros = 3;
  sint64 valid_until_unix_micros = 4;
}

message FederatedBackupAllocationPage {
  bytes request_digest = 1;
  uint64 authority_revision = 2;
  repeated FederatedBackupAllocation allocations = 3;
  bytes next_cursor = 4;
  bytes signature = 5;
}

// Opaque continuation bound to the relationship, epoch, grant, size and snapshot.
message FederatedBackupAllocationCursor {
  uint32 format_version = 1;
  bytes relationship_id = 2;
  uint64 authority_epoch = 3;
  bytes grant_id = 4;
  uint64 required_bytes = 5;
  uint64 snapshot_revision = 6;
  sint64 valid_from_unix_micros = 7;
  sint64 valid_until_unix_micros = 8;
  bytes allocation_id = 9;
}

message FederationEnvelope {
  FederationHeader header = 1;
  oneof message {
    FederationHello hello = 10;
    FederationWelcome welcome = 11;
    FetchFederationAuthority fetch_authority = 20;
    FederationAuthorityPage authority_page = 21;
    FetchFederatedBranchPage fetch_branch_page = 30;
    FederatedBranchPage branch_page = 31;
    ProposeFederatedBranch propose_branch = 32;
    FederatedBranchResult branch_result = 33;
    FetchFederatedHistoryObject fetch_history_object = 34;
    FederatedHistoryObjectHeader history_object_header = 35;
    FetchFederatedContentLayout fetch_content_layout = 36;
    FederatedContentLayoutPage content_layout_page = 37;
    FetchFederatedContentShard fetch_content_shard = 38;
    FederatedContentShardHeader content_shard_header = 39;
    RequestFederatedStorageCapability request_storage_capability = 40;
    FederatedStorageCapability storage_capability = 41;
    FederatedStorageReceipt storage_receipt = 42;
    FetchFederatedStorageInventory fetch_storage_inventory = 43;
    FederatedStorageInventoryPage storage_inventory_page = 44;
    RequestFederatedBackupCapability request_backup_capability = 50;
    FederatedBackupCapability backup_capability = 51;
    ExecuteFederatedBackup execute_backup = 52;
    FederatedBackupReady backup_ready = 53;
    FederatedBackupResult backup_result = 54;
    FetchFederatedBackupAllocations fetch_backup_allocations = 55;
    FederatedBackupAllocationPage backup_allocation_page = 56;
  }
}
