# SPDX-License-Identifier: GPL-2.0-only

[workspace]
members = [
    "crates/meshspan-api-contract",
    "crates/meshspan-contracts",
    "crates/meshspan-consensus",
    "crates/meshspan-domain",
    "crates/meshspan-metadata",
    "crates/meshspan-protocol",
]
resolver = "3"

[workspace.package]
authors = ["MeshSpan contributors"]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/KarlLivesey/MeshSpan"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
jsonschema = { version = "0.52.0", default-features = false }
prost = "0.14.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.16"
unicode-normalization = "0.1.25"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unexpected_cfgs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
dbg_macro = "deny"
expect_used = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"
