# SPDX-License-Identifier: GPL-2.0-only

[workspace]
members = [
    "crates/meshspan-api-contract",
    "crates/meshspan-acme",
    "crates/meshspan-certificates",
    "crates/meshspan-cluster",
    "crates/meshspan-coding",
    "crates/meshspan-contracts",
    "crates/meshspan-consensus",
    "crates/meshspan-data-plane",
    "crates/meshspan-daemon",
    "crates/meshspan-domain",
    "crates/meshspan-dns",
    "crates/meshspan-filesystem",
    "crates/meshspan-metadata",
    "crates/meshspan-otp",
    "crates/meshspan-passkey",
    "crates/meshspan-placement",
    "crates/meshspan-protobuf",
    "crates/meshspan-protocol",
    "crates/meshspan-quinn-rustls",
    "crates/meshspan-recovery-bundle",
    "crates/meshspan-rustls-provider",
    "crates/meshspan-secret-envelope",
    "crates/meshspan-smb",
    "crates/meshspan-storage",
    "crates/meshspan-sync-wrapper",
    "crates/meshspan-test-certificates",
    "crates/meshspan-transport",
    "crates/meshspan-work",
]
resolver = "3"

[workspace.package]
authors = ["MeshSpan contributors"]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/KarlLivesey/MeshSpan"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
aes-gcm = "0.11.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
boon = "0.6.1"
bytes = "1.12.1"
blake3 = "1.8.7"
cap-std = "4.0.3"
chacha20poly1305 = "0.11.0"
chacha20 = { version = "0.10.2", features = ["zeroize"] }
cmac = { version = "0.8.0", features = ["zeroize"] }
ed25519-dalek = "3.0.0"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
form_urlencoded = "1.2.2"
hmac = "0.13.0"
http-body-util = "0.1.5"
hkdf = "0.13.0"
md-5 = "0.11.0"
md4 = "0.11.0"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["service", "tokio"] }
meshspan-protobuf = { path = "crates/meshspan-protobuf" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pem", "pkcs8", "std"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio"] }
quinn-proto = { version = "0.11.17", default-features = false }
rcgen = { version = "0.14.9", default-features = false }
reed-solomon-simd = "3.1.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
rustls = { version = "0.23.43", default-features = false, features = ["custom-provider", "std"] }
rustls-native-certs = "0.8.4"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha1 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.16"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
unicode-normalization = "0.1.25"
unicode-casefold = "0.2.0"
zeroize = "1.9.0"
x25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
x509-parser = { version = "0.18.1", default-features = false }

[patch.crates-io]
sync_wrapper = { path = "crates/meshspan-sync-wrapper" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unexpected_cfgs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
dbg_macro = "deny"
expect_used = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"
