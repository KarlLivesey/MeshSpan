# SPDX-License-Identifier: GPL-2.0-only

[workspace]
members = [
    "crates/meshspan-api-contract",
    "crates/meshspan-cluster",
    "crates/meshspan-contracts",
    "crates/meshspan-consensus",
    "crates/meshspan-data-plane",
    "crates/meshspan-daemon",
    "crates/meshspan-domain",
    "crates/meshspan-filesystem",
    "crates/meshspan-metadata",
    "crates/meshspan-protocol",
    "crates/meshspan-storage",
    "crates/meshspan-transport",
]
resolver = "3"

[workspace.package]
authors = ["MeshSpan contributors"]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/KarlLivesey/MeshSpan"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.12.1"
blake3 = "1.8.7"
cap-std = "4.0.3"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
jsonschema = { version = "0.52.0", default-features = false }
prost = "0.14.4"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.9", default-features = false, features = ["ring"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
unicode-normalization = "0.1.25"
unicode-casefold = "0.2.0"
zeroize = "1.9.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unexpected_cfgs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
dbg_macro = "deny"
expect_used = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"
